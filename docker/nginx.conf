# PYTHON LAB —— Nginx 反向代理（docker compose --profile proxy 时启用）
#
# 路由：
#   /api/*     -> backend:8000
#   /health    -> backend:8000
#   /sandbox/* -> sandbox:8081（仅内网使用，生产建议不对外暴露）
#   /*         -> frontend:3000
#
# HTTPS：把证书放到 docker/certs/{fullchain.pem,privkey.pem} 后启用 443 server 块。

upstream pythonlab_backend {
    server backend:8000;
    keepalive 16;
}

upstream pythonlab_frontend {
    server frontend:3000;
    keepalive 16;
}

upstream pythonlab_sandbox {
    server sandbox:8081;
    keepalive 8;
}

# 限流：登录/注册与执行类接口更严格（与 API.md 1.4 对齐）
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=300r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/markdown;
    gzip_min_length 1024;

    location /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://pythonlab_backend;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://pythonlab_backend;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /health {
        proxy_pass http://pythonlab_backend;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # 沙箱只允许内网访问；如需对外请追加 allow/deny 白名单
    location /sandbox/ {
        proxy_pass http://pythonlab_sandbox/;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /_next/static/ {
        proxy_pass http://pythonlab_frontend;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://pythonlab_frontend;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}

# 公共代理参数（内联在本文件里，避免额外文件挂载）
