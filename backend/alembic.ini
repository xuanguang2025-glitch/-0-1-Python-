; PYTHON LAB —— Alembic 配置
; 迁移脚本目录：backend/alembic（含 env.py / script.py.mako / versions/）
; 用法（在 backend/ 目录下执行）：
;   alembic revision --autogenerate -m "xxx"
;   alembic upgrade head
;   alembic downgrade -1

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
; 迁移文件名前缀：0001_xxx.py
file_template = %%(rev)s_%%(slug)s

; 数据库连接串：留空时由 alembic/env.py 从 app.core.config 读取（推荐）
sqlalchemy.url =

; 迁移文件名格式由 file_template 决定；如需自动格式化迁移文件，可在此启用
; post_write_hooks（注意 configparser 插值需写 %%(VAR)s 转义）
[post_write_hooks]
hooks =

; 日志配置：alembic 自身输出
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
