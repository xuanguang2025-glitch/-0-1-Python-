[pytest]
# PYTHON LAB —— 后端测试配置
testpaths = app/tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
# 把项目根（backend/）加入 sys.path，让 `conftest.py` 的 `import app...` 在任何调用方式下都成立。
# 为什么必须显式声明：pytest 的 `pythonpath` 插件不会自动把 rootdir 塞进 sys.path，
# 而 console script（裸 `pytest`）不像 `python -m pytest` 那样隐式把 CWD 放在 sys.path[0]。
# 二者差异实测（本机 venv）：
#   pytest.exe tests/ -q                              → ModuleNotFoundError: No module named 'app'（exit 4 usage error）
#   python -m pytest tests/ -q                        → 正常
#   pytest.exe tests/ -q -o pythonpath=.              → 正常（exit 0）
# CI 里用的是裸 `pytest`，故此处显式声明，避免 Windows 本机（习惯用 python -m）掩盖该问题。
pythonpath = .
# 测试环境强制使用 SQLite 内存库 + 进程内缓存 + inline 队列，避免依赖外部服务
env =
    APP_ENV=testing
    DATABASE_URL=sqlite:///./data/pythonlab_test.db
    CACHE_BACKEND=memory
    QUEUE_BACKEND=inline
    SANDBOX_MODE=stub
    AI_OFFLINE=true
filterwarnings =
    ignore::DeprecationWarning
