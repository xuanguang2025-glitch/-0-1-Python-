[pytest]
# PYTHON LAB —— 后端测试配置
testpaths = app/tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
# 测试环境强制使用 SQLite 内存库 + 进程内缓存 + inline 队列，避免依赖外部服务
env =
    APP_ENV=testing
    DATABASE_URL=sqlite:///./data/pythonlab_test.db
    CACHE_BACKEND=memory
    QUEUE_BACKEND=inline
    SANDBOX_MODE=stub
    AI_OFFLINE=true
filterwarnings =
    ignore::DeprecationWarning
